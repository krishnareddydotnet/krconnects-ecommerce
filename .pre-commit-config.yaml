# Pre-commit hooks for KRConnects
# These checks run automatically on every "git commit" (only on staged changes).
# Install once per clone:  pre-commit install

repos:
  # Gitleaks: blocks the commit if it finds secrets
  # (passwords, API keys, tokens, connection strings, private keys)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1          # pinned version = same scanner for every developer
    hooks:
      - id: gitleaks