server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Health probe endpoints
    location /health/live {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location /health/ready {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Forward Auth API calls (login) to the Auth API inside the cluster.
    # Browser calls /api/auth/login -> nginx calls http://auth-api:8080/auth/login
    # (the trailing "/" after 8080 removes the "/api" part)
    location /api/ {
        proxy_pass http://auth-api:8080/;
    }

    # Forward Catalog API calls (products, incl. /admin/products) to the Catalog API.
    # Browser calls /catalog-api/admin/products -> nginx calls http://catalog-api:8081/admin/products
    location /catalog-api/ {
        proxy_pass http://catalog-api:8081/;
    }

    # Forward Order API calls (/admin/orders) to the Order API.
    # Browser calls /order-api/admin/orders -> nginx calls http://order-api:8082/admin/orders
    location /order-api/ {
        proxy_pass http://order-api:8082/;
    }

    # Angular app: everything else returns index.html (the Angular router picks the page)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
