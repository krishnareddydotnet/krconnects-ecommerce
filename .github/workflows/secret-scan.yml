name: secret scan

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read          # read the code
      pull-requests: read     # list the commits in the PR
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0      # full history, so every commit in the PR is scanned

      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false   # no PR comments, so the job stays read-only
