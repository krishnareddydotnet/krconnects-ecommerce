name: customer portal ci

permissions:
  contents: write  # for pushing updated Helm values file back to the repo

on:
  push:
    branches:
      - main
    paths:
      - 'customer-portal/**'
      - '.github/workflows/customer-portal-ci.yml'
  workflow_dispatch: 

env:
  IMAGE_TAG: v1.0.0
  
jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: customer-portal
        
    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: install dependency packages
        run: npm ci

      - name: test
        run: npm test

      - name: generate production files
        run: npm run build 

      - name: docker setup
        uses: docker/setup-docker-action@v5

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Image tag = first 7 characters of the commit SHA (e.g. a1b2c3d)
      - name: generate git sha
        id: image_tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

          
      - name: build docker image
        run: docker build -t ${{secrets.DOCKERHUB_USERNAME}}/customer-portal:${{steps.image_tag.outputs.tag}} .

      - name: docker push
        run: docker push ${{secrets.DOCKERHUB_USERNAME}}/customer-portal:${{steps.image_tag.outputs.tag}}
        

      
      # Write the new tag into the Helm values file.
      # Runs from the REPO ROOT (not ./data-api), so the path is simply helm/...
      - name: Update Helm image tag
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          IMAGE_TAG: ${{ steps.image_tag.outputs.tag }}
        run: |
          sed -i -E "s/^([[:space:]]*tag:).*/\1 \"$IMAGE_TAG\"/" helm/ecommerce/values-customer-portal.yaml
          echo "New values file:"
          cat helm/ecommerce/values-customer-portal.yaml

      # Commit and push the updated values file (GitOps).
      # Also from the REPO ROOT - this was the cause of the error.
      - name: Commit and push Helm values
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/ecommerce/values-customer-portal.yaml

          # Nothing changed? Then stop here (no empty commit)
          git diff --cached --quiet && exit 0

          git commit -m "chore: update customer-portal image tag to ${{ steps.image_tag.outputs.tag }}"
          git pull --rebase   # in case main moved while the pipeline was running
          git push
