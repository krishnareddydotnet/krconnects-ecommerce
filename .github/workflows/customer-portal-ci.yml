name: customer portal ci

permissions:
  contents: write  # for pushing updated Helm values file back to the repo
  pull-requests: write

on:
  push:
    branches:
      - main
    paths:
      - 'customer-portal/**'
      - '.github/workflows/customer-portal-ci.yml'
  workflow_dispatch: 
  
jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: customer-portal
        
    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: install dependency packages
        run: npm ci

      - name: test
        run: npm test

      - name: generate production files
        run: npm run build 

      - name: docker setup
        uses: docker/setup-docker-action@v5

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Image tag = first 7 characters of the commit SHA (e.g. a1b2c3d)
      - name: generate git sha
        id: image_tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

          
      - name: build docker image
        run: docker build -t ${{secrets.DOCKERHUB_USERNAME}}/customer-portal:${{steps.image_tag.outputs.tag}} .

      - name: docker push
        run: docker push ${{secrets.DOCKERHUB_USERNAME}}/customer-portal:${{steps.image_tag.outputs.tag}}
        

      
      # Write the new tag into the Helm values file.
      - name: Update Helm image tag
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          IMAGE_TAG: ${{ steps.image_tag.outputs.tag }}
        run: |
          sed -i -E "s/^([[:space:]]*tag:).*/\1 \"$IMAGE_TAG\"/" helm/ecommerce/values-customer-portal.yaml
          echo "New values file:"
          cat helm/ecommerce/values-customer-portal.yaml


      # Create a PR for the Helm image tag update (GitOps).
      - name: Create PR for Helm image update
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update customer-portal image tag to ${{ steps.image_tag.outputs.tag }}"
          branch: automation/customer-portal-image-update
          base: main
          title: "chore: update customer-portal image tag"
          body: "Automated Helm image update after successful customer-portal CI."
          add-paths: helm/ecommerce/values-customer-portal.yaml


