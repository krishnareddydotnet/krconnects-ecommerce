name: catalog api CI

permissions:
 contents: write
 

on:
  push:
    branches:
      - main
    paths:
      - 'catalog-api/**'
      - '.github/workflows/catalog-api-ci.yml'
      
  workflow_dispatch:

jobs:

  build_java:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: ./catalog-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: catalog-api/pom.xml   # monorepo: point to this service's pom.xml

          
      - run: java --version

      - name: compile
        run: mvn -B compile

        #Downloads dependencies and runs 9 tests
      - name: test 
        run: mvn -B test 

        #Builds the runnable jar
      - name: package
        run: mvn -B package -DskipTests

  build_docker:
    needs: build_java

   
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: ./catalog-api

    steps:
      - name: checkout code
        uses: actions/checkout@v6.0.0

      - name: docker login
        uses: docker/login-action@v4
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      # Image tag = first 7 characters of the commit SHA (e.g. a1b2c3d)
      - name: generate git sha
        id: image_tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"


      - name: docker setup
        uses: docker/setup-docker-action@v5

      - name: docker build
        run: docker build -t ${{secrets.DOCKERHUB_USERNAME}}/catalog-api:${{steps.image_tag.outputs.tag}} .

      - name: Scan container image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/catalog-api:${{ steps.image_tag.outputs.tag }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: docker push
        run: docker push ${{secrets.DOCKERHUB_USERNAME}}/catalog-api:${{steps.image_tag.outputs.tag}}


      # Write the new tag into the Helm values file.
      # Runs from the REPO ROOT (not ./data-api), so the path is simply helm/...
      - name: Update Helm image tag
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          IMAGE_TAG: ${{ steps.image_tag.outputs.tag }}
        run: |
          sed -i -E "s/^([[:space:]]*tag:).*/\1 \"$IMAGE_TAG\"/" helm/ecommerce/values-catalog-api.yaml
          echo "New values file:"
          cat helm/ecommerce/values-catalog-api.yaml


      # Commit and push the updated values file (GitOps).
      # Also from the REPO ROOT - this was the cause of the error.
      - name: Create PR for Helm image update
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update catalog-api image tag to ${{ steps.image_tag.outputs.tag }}"
          branch: automation/catalog-api-image-update
          base: main
          title: "chore: update catalog-api image tag"
          body: "Automated Helm image update after successful catalog-api CI."
          add-paths: helm/ecommerce/values-catalog-api.yaml

