name: catalog api CI

permissions:
 contents: write

on:
  push:
    branches:
      - main
    paths:
      - 'catalog-api/**'
      - '.github/workflows/catalog-api-ci.yml'
      
  workflow_dispatch:

env:
  
  IMAGE_TAG: v1.1.0

jobs:

  build_dotnet:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: ./catalog-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: catalog-api/pom.xml   # monorepo: point to this service's pom.xml

          
      - run: java --version

      - name: compile
        run: mvn -B compile

        #Downloads dependencies and runs 9 tests
      - name: test 
        run: mvn -B test 

        #Builds the runnable jar
      - name: test
        run: mvn -B package -DskipTests

  build_docker:
    needs: build_dotnet

   
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: ./catalog-api

    steps:
      - name: checkout code
        uses: actions/checkout@v6.0.0

      - name: docker login
        uses: docker/login-action@v4
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      # Image tag = first 7 characters of the commit SHA (e.g. a1b2c3d)
      - name: generate git sha
        id: image_tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"


      - name: docker setup
        uses: docker/setup-docker-action@v5

      - name: docker build
        run: docker build -t ${{secrets.DOCKERHUB_USERNAME}}/catalog-api:${{steps.image_tag.outputs.tag}} .

      - name: docker push
        run: docker push ${{secrets.DOCKERHUB_USERNAME}}/catalog-api:${{steps.image_tag.outputs.tag}}


      # Write the new tag into the Helm values file.
      # Runs from the REPO ROOT (not ./data-api), so the path is simply helm/...
      - name: Update Helm image tag
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          IMAGE_TAG: ${{ steps.image_tag.outputs.tag }}
        run: |
          sed -i -E "s/^([[:space:]]*tag:).*/\1 \"$IMAGE_TAG\"/" helm/ecommerce/values-catalog-api.yaml
          echo "New values file:"
          cat helm/ecommerce/values-catalog-api.yaml

      # Commit and push the updated values file (GitOps).
      # Also from the REPO ROOT - this was the cause of the error.
      - name: Commit and push Helm values
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/ecommerce/values-catalog-api.yaml

          # Nothing changed? Then stop here (no empty commit)
          git diff --cached --quiet && exit 0

          git commit -m "chore: update customer-portal image tag to ${{ steps.image_tag.outputs.tag }}"
          git pull --rebase   # in case main moved while the pipeline was running
          git push

        
