name: data api ci

permissions:
  contents: read
  

on:
  push:
    branches:
      - main
    paths:
      - 'data-api/**'
      - '.github/workflows/data-api-ci.yml'

  workflow_dispatch:

jobs:

  build_dotnet:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: ./data-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: secrets scanning
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: restore packages
        run: dotnet restore

      - name: build
        run: dotnet build

      - name: test
        run: dotnet test tests/DataApi.Tests/DataApi.Tests.csproj

  build_docker:
    needs: build_dotnet
    runs-on: ubuntu-24.04

    # This job pushes a commit (new image tag) back to the repo -> needs write.
    # Only THIS job gets write; build_dotnet stays read-only (least privilege).
    permissions:
      contents: write
      pull-requests: write

    defaults:
      run:
        working-directory: ./data-api

    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: docker login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Image tag = first 7 characters of the commit SHA (e.g. a1b2c3d)
      - name: generate git sha
        id: image_tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: docker build
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/data-api:${{ steps.image_tag.outputs.tag }} .

      - name: Scan container image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/data-api:${{ steps.image_tag.outputs.tag }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: docker push
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/data-api:${{ steps.image_tag.outputs.tag }}

      # Write the new tag into the Helm values file.
      # Runs from the REPO ROOT (not ./data-api), so the path is simply helm/...
      - name: Update Helm image tag
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          IMAGE_TAG: ${{ steps.image_tag.outputs.tag }}
        run: |
          sed -i -E "s/^([[:space:]]*tag:).*/\1 \"$IMAGE_TAG\"/" helm/ecommerce/values-data-api.yaml
          echo "New values file:"
          cat helm/ecommerce/values-data-api.yaml

      # Commit and push the updated values file (GitOps).
      # Also from the REPO ROOT - this was the cause of the error.
      - name: Create PR for Helm image update
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update data-api image tag to ${{ steps.image_tag.outputs.tag }}"
          branch: automation/data-api-image-update
          base: main
          title: "chore: update data-api image tag"
          body: "Automated Helm image update after successful data-api CI."
          add-paths: helm/ecommerce/values-data-api.yaml
