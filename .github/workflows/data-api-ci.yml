name: data api ci

# Workflow-level permissions: used by the publish job (job 1 sets its own, smaller set)
permissions:
  contents: write        # create the branch with the updated Helm values file
  pull-requests: write   # open the Helm image-tag PR

on:
  push:
    branches:
      - main
    paths:
      - 'data-api/**'
      - '.github/workflows/data-api-ci.yml'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------
  # Job 1: secret scan, build, test, image build, Trivy, push and sign
  # The registry (Docker Hub or ACR) is chosen with the repository VARIABLE IMAGE_REGISTRY.
  # ---------------------------------------------------------------
  data-api-build-test:
    runs-on: ubuntu-24.04

    # Job-level permissions REPLACE the workflow-level ones for this job (least privilege):
    permissions:
      contents: read     # check out the code
      id-token: write    # let GitHub issue an OIDC token, used by azure/login (ACR) and Cosign keyless signing

    # Expose the registry NAME, image tag and digest to the next job (step output -> job output)
    # Only the NAME ("dockerhub" or "acr") is passed, not "docker.io/ckreddy3030": that full value contains
    # the value of the secret DOCKERHUB_USERNAME, and GitHub silently DROPS a job output that contains a
    # secret (job 2 would get an empty string). Job 2 maps the name back to the full registry.
    outputs:
      registry_name: ${{ steps.registry.outputs.name }}
      image_tag: ${{ steps.image_tag.outputs.tag }}
      image_digest: ${{ steps.image_digest.outputs.digest }}

    defaults:
      run:
        working-directory: data-api

    steps:
      - name: checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0          # full history, so gitleaks can scan every new commit

      # ---------- Which registry? (computed ONCE, used by every step below) ----------
      # Repository VARIABLE (not a secret): Settings > Secrets and variables > Actions > Variables > IMAGE_REGISTRY
      #   "dockerhub" (or not set) -> docker.io/ckreddy3030/data-api          (default, free)
      #   "acr"                    -> krconnectspractice.azurecr.io/data-api  (AKS practice)
      # The Docker Hub account is written here (it is public); it equals the secret DOCKERHUB_USERNAME,
      # so only the registry NAME is passed to job 2 (see "outputs" above).
      - name: choose image registry
        id: registry
        env:
          IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
        run: |
          case "${IMAGE_REGISTRY:-dockerhub}" in
            dockerhub) REGISTRY="docker.io/ckreddy3030" ;;
            acr)       REGISTRY="krconnectspractice.azurecr.io" ;;
            *)         echo "IMAGE_REGISTRY must be 'dockerhub' or 'acr', not '$IMAGE_REGISTRY'"; exit 1 ;;
          esac
          echo "Registry: $REGISTRY"
          echo "name=${IMAGE_REGISTRY:-dockerhub}" >> "$GITHUB_OUTPUT"
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"
          echo "image=$REGISTRY/data-api" >> "$GITHUB_OUTPUT"

      - name: secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: restore packages
        run: dotnet restore

      - name: build
        run: dotnet build

      - name: unit tests
        run: dotnet test tests/DataApi.Tests/DataApi.Tests.csproj

      # ---------- Log in to the chosen registry (only ONE of these runs) ----------
      # Docker Hub: username + access token stored as repository secrets
      - name: docker login (Docker Hub)
        if: steps.registry.outputs.name == 'dockerhub'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ACR: log in to Azure with OIDC (no client secret). The identity only has AcrPush on krconnectspractice.
      - name: azure login (ACR, OIDC)
        if: steps.registry.outputs.name == 'acr'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_ACR_PUSH_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Gives Docker (and Cosign, which reads Docker's login) a short-lived token for the registry
      - name: docker login (ACR)
        if: steps.registry.outputs.name == 'acr'
        run: az acr login --name krconnectspractice

      # Image tag = first 7 characters of the commit SHA (e.g. a1b2c3d)
      - name: generate git sha
        id: image_tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: docker build
        run: docker build -t ${{ steps.registry.outputs.image }}:${{ steps.image_tag.outputs.tag }} .

      # Fails the job on fixable CRITICAL/HIGH vulnerabilities, so a vulnerable image is never pushed
      - name: scan container image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ steps.registry.outputs.image }}:${{ steps.image_tag.outputs.tag }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: docker push
        run: docker push ${{ steps.registry.outputs.image }}:${{ steps.image_tag.outputs.tag }}

      # After the push, Docker knows the image DIGEST: the sha256 hash of the image content.
      # A tag can be moved to another image later; a digest never changes.
      # RepoDigests looks like "<registry>/data-api@sha256:4f2a..."; we keep only the part after "@".
      - name: get image digest
        id: image_digest
        run: |
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ steps.registry.outputs.image }}:${{ steps.image_tag.outputs.tag }} | cut -d'@' -f2)
          echo "Image digest: $DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # ---------- Image signing with Cosign (keyless) ----------
      # Keyless = no private key to store. Cosign uses this job's GitHub OIDC identity
      # ("workflow data-api-ci.yml in this repo, on this branch") to get a short-lived
      # certificate from Sigstore, signs the image, and records it in a public transparency log.
      - name: install cosign
        uses: sigstore/cosign-installer@v3

      # Always sign the DIGEST (exact content), never just the tag (tags can move).
      # The signature is stored next to the image in the same registry (uses the login above).
      - name: sign image
        run: cosign sign --yes ${{ steps.registry.outputs.image }}@${{ steps.image_digest.outputs.digest }}

      # Prove it works: verify the signature was made by THIS workflow in THIS repo.
      - name: verify image signature
        run: |
          cosign verify \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/data-api-ci.yml@${{ github.ref }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            ${{ steps.registry.outputs.image }}@${{ steps.image_digest.outputs.digest }}

      # ---------- SBOM (Software Bill of Materials) ----------
      # Lists every package and version inside the image (OS packages + app libraries).
      # Generated FROM the pushed image digest, in the standard SPDX JSON format.
      # The action also uploads it as a workflow artifact (download it from the run summary).
      - name: generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.registry.outputs.image }}@${{ steps.image_digest.outputs.digest }}
          format: spdx-json
          output-file: ${{ github.workspace }}/sbom.spdx.json

      # Attach the SBOM to the image as a SIGNED attestation (same keyless identity as the signature).
      # Stored next to the image in the same registry (a "sha256-<digest>.att" tag).
      - name: attest SBOM (Cosign)
        run: cosign attest --yes --type spdxjson --predicate "$GITHUB_WORKSPACE/sbom.spdx.json" ${{ steps.registry.outputs.image }}@${{ steps.image_digest.outputs.digest }}

      # Prove the SBOM attestation is genuine (signed by THIS workflow). Output is large, so only show the result.
      - name: verify SBOM attestation
        run: |
          cosign verify-attestation --type spdxjson \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/data-api-ci.yml@${{ github.ref }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            ${{ steps.registry.outputs.image }}@${{ steps.image_digest.outputs.digest }} > /dev/null
          echo "SBOM attestation verified for data-api"

  # ---------------------------------------------------------------
  # Job 2: write the new registry, tag and digest into the Helm values file and open a PR (GitOps)
  # Runs on a NEW runner, so it checks out the code again.
  # ---------------------------------------------------------------
  data-api-publish:
    needs: data-api-build-test
    runs-on: ubuntu-24.04

    # Read the registry name, tag and digest from job 1 (needs.<job-id>.outputs.<name>)
    env:
      REGISTRY_NAME: ${{ needs.data-api-build-test.outputs.registry_name }}
      IMAGE_TAG: ${{ needs.data-api-build-test.outputs.image_tag }}
      IMAGE_DIGEST: ${{ needs.data-api-build-test.outputs.image_digest }}

    steps:
      - name: checkout code
        uses: actions/checkout@v6

      # Inside run: (bash) use $IMAGE_TAG / $IMAGE_DIGEST; they are inherited from the job-level env above
      # The tag is for humans (which version); the digest is what Kubernetes actually pulls.
      # The registry is where the image was pushed, so Helm always pulls from where the image really is.
      # (The registry contains "/", so that sed uses "|" as separator.)
      - name: Update Helm image registry, tag and digest
        shell: bash
        run: |
          # Job 1 passes only the registry NAME (a full registry containing the Docker Hub username would be
          # dropped by GitHub as a secret). Map it to the full registry with the same case as in job 1.
          case "$REGISTRY_NAME" in
            dockerhub) IMAGE_REGISTRY="docker.io/ckreddy3030" ;;
            acr)       IMAGE_REGISTRY="krconnectspractice.azurecr.io" ;;
            *)         echo "Unknown registry name from job 1: '$REGISTRY_NAME'"; exit 1 ;;
          esac
          echo "IMAGE_REGISTRY=$IMAGE_REGISTRY" >> "$GITHUB_ENV"   # also used by the PR step below
          sed -i -E "s|^([[:space:]]*registry:).*|\1 \"$IMAGE_REGISTRY\"|" helm/ecommerce/values-data-api.yaml
          sed -i -E "s/^([[:space:]]*tag:).*/\1 \"$IMAGE_TAG\"/" helm/ecommerce/values-data-api.yaml
          sed -i -E "s/^([[:space:]]*digest:).*/\1 \"$IMAGE_DIGEST\"/" helm/ecommerce/values-data-api.yaml
          echo "New values file:"
          cat helm/ecommerce/values-data-api.yaml

      # Outside run: (with:, env:, if:) use the expression syntax ${{ env.IMAGE_TAG }}
      # main is protected, so the new tag goes in through a PR
      - name: Create PR for Helm image update
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update data-api image tag to ${{ env.IMAGE_TAG }}"
          branch: automation/data-api-image-update
          base: main
          title: "chore: update data-api image tag"
          body: |
            Automated Helm image update after successful data-api CI.
            - Registry: `${{ env.IMAGE_REGISTRY }}`
            - Tag: `${{ env.IMAGE_TAG }}`
            - Digest: `${{ env.IMAGE_DIGEST }}`
          add-paths: helm/ecommerce/values-data-api.yaml
