name: auth api ci

permissions: 
  contents: write
  pull-requests: write

on:
  push:
   branches:
     - main
   paths:
      - 'auth-api/**'
      - '.github/workflows/auth-api-ci.yml'
defaults:
  run:
    working-directory: ./auth-api

jobs:
  
  build:
  
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: secret scanning gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
      - name: setup dotnet core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Downloads the NuGet packages
        run: dotnet restore AuthApi.csproj

      - name: Compiles the API
        run: dotnet build AuthApi.csproj --no-restore -c Release

      - name: test
        run: dotnet test tests/AuthApi.Tests/AuthApi.Tests.csproj

      - name: docker login
        uses: docker/login-action@v4
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      # Image tag = first 7 characters of the commit SHA (e.g. a1b2c3d)
      - name: generate git sha
        id: image_tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: docker setup
        uses: docker/setup-docker-action@v5



      - name: docker build
        run: docker build -t ${{secrets.DOCKERHUB_USERNAME}}/auth-api:${{steps.image_tag.outputs.tag}} .

      - name: docker push
        run: docker push ${{secrets.DOCKERHUB_USERNAME}}/auth-api:${{steps.image_tag.outputs.tag}}
        

        

        

      
  
      # Write the new tag into the Helm values file.
      # Runs from the REPO ROOT (not ./data-api), so the path is simply helm/...
      - name: Update Helm image tag
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          IMAGE_TAG: ${{ steps.image_tag.outputs.tag }}
        run: |
          sed -i -E "s/^([[:space:]]*tag:).*/\1 \"$IMAGE_TAG\"/" helm/ecommerce/values-auth-api.yaml
          echo "New values file:"
          cat helm/ecommerce/values-auth-api.yaml

      # Create a PR for the Helm image tag update (GitOps).
      - name: Create PR for Helm image update
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update auth-api image tag to ${{ steps.image_tag.outputs.tag }}"
          branch: automation/auth-api-image-update
          base: main
          title: "chore: update auth-api image tag"
          body: "Automated Helm image update after successful auth-api CI."
          add-paths: helm/ecommerce/values-auth-api.yaml

        
