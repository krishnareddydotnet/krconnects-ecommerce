name: auth api ci

permissions: 
  contents: write

on:
  push:
   branches:
     - main
   paths:
      - 'auth-api/**'
      - '.github/workflows/auth-api-ci.yml'
defaults:
  run:
    working-directory: ./auth-api

env:
  IMAGE_TAG: v1.0.0

jobs:
  
  build:
  
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: secret scanning gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
      - name: setup dotnet core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Downloads the NuGet packages
        run: dotnet restore AuthApi.csproj

      - name: Compiles the API
        run: dotnet build AuthApi.csproj --no-restore -c Release

      - name: test
        run: dotnet test tests/AuthApi.Tests/AuthApi.Tests.csproj

      - name: docker login
        uses: docker/login-action@v4
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      # Image tag = first 7 characters of the commit SHA (e.g. a1b2c3d)
      - name: generate git sha
        id: image_tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: docker setup
        uses: docker/setup-docker-action@v5



      - name: docker build
        run: docker build -t ${{secrets.DOCKERHUB_USERNAME}}/auth-api:${{steps.image_tag.outputs.tag}} .

      - name: docker push
        run: docker push ${{secrets.DOCKERHUB_USERNAME}}/auth-api:${{steps.image_tag.outputs.tag}}
        

        

        

      
  
      # Write the new tag into the Helm values file.
      # Runs from the REPO ROOT (not ./data-api), so the path is simply helm/...
      - name: Update Helm image tag
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          IMAGE_TAG: ${{ steps.image_tag.outputs.tag }}
        run: |
          sed -i -E "s/^([[:space:]]*tag:).*/\1 \"$IMAGE_TAG\"/" helm/ecommerce/values-auth-api.yaml
          echo "New values file:"
          cat helm/ecommerce/values-auth-api.yaml

      # Commit and push the updated values file (GitOps).
      # Also from the REPO ROOT - this was the cause of the error.
      - name: Commit and push Helm values
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/ecommerce/values-auth-api.yaml

          # Nothing changed? Then stop here (no empty commit)
          git diff --cached --quiet && exit 0

          git commit -m "chore: update auth-api image tag to ${{ steps.image_tag.outputs.tag }}"
          git pull --rebase   # in case main moved while the pipeline was running
          git push
