server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Health probe endpoints
    location /health/live {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location /health/ready {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Forward Auth API calls to the Auth API inside the cluster.
    # Browser calls /api/hello -> nginx calls http://authapi:8080/hello
    # (the trailing "/" after 8080 removes the "/api" part)
    location /api/ {
        proxy_pass http://auth-api:8080/;
    }

    # Forward Catalog API calls to the Catalog API inside the cluster.
    # Browser calls /catalog-api/products -> nginx calls http://catalog-api:8081/products
    # (the trailing "/" after 8081 removes the "/catalog-api" part)
    location /catalog-api/ {
        proxy_pass http://catalog-api:8081/;
    }

    # Forward Order API calls to the Order API inside the cluster.
    # Browser calls /order-api/orders -> nginx calls http://order-api:8082/orders
    # (the trailing "/" after 8082 removes the "/order-api" part)
    location /order-api/ {
        proxy_pass http://order-api:8082/;
    }

    # index.html: never use a cached copy without asking the server first.
    # After a release the browser gets the NEW index.html, which points to the new JS/CSS files.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Built JS/CSS files: their names contain a hash (index-AbC123.js) that changes with every build,
    # so the content of a name never changes: the browser may keep them for a year.
    # A missing file returns 404 (not index.html), so an old page fails clearly instead of loading HTML as JS.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # React app: everything else (page routes like /cart) returns index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}