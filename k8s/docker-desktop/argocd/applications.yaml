# Argo CD Application: customer-portal (deploys the plain YAML k8s/docker-desktop/apps/customer-portal.yaml from main)
# WARNING: do not have this app and "customer-portal-canary" (canary-customer-portal.yaml) or
# "customer-portal-bluegreen" (bluegreen-customer-portal.yaml) at the same time.
# All own sa/customer-portal, and this Deployment would run next to the scenario's Rollout.
# For a scenario delete this app first (k8s/docker-desktop/istio/scenarios/canary/README.md or blue-green/README.md).
