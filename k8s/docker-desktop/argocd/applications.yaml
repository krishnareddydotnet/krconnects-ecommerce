# Argo CD Application: data-api (deploys helm/ecommerce with values-data-api.yaml from main)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: data-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/krishnareddydotnet/krconnects-ecommerce.git
    targetRevision: main
    path: helm/ecommerce
    helm:
      valueFiles:
        - values-data-api.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true        # remove resources that were deleted from Git
      selfHeal: true     # undo manual changes made in the cluster
---
