# The 6 Argo CD Applications for Docker Desktop: one per service, each deploys ONE plain YAML file
# from k8s/docker-desktop/apps/ (Docker Hub images; the docker-<service>-ci.yml bot PR updates the image line).
# The Helm chart helm/ecommerce is no longer used here (kept for reference).
#
# Argo CD Application: data-api (deploys the plain YAML k8s/docker-desktop/apps/data-api.yaml from main)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: data-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/krishnareddydotnet/krconnects-ecommerce.git
    targetRevision: main
    path: k8s/docker-desktop/apps          # plain YAML folder (no Helm)
    directory:
      include: data-api.yaml               # only this service's file from the folder
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true        # remove resources that were deleted from Git
      selfHeal: true     # undo manual changes made in the cluster
---
