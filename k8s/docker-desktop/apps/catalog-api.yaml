# -----------------------------------------------------------------------
# catalog-api on Docker Desktop: product list/details, admin product endpoints
#
# Tech stack : Java 25, Spring Boot 4.1
# Port       : 8081
# Runs as    : UID 10001 (user created in the catalog-api Dockerfile)
# Objects    : ServiceAccount, Deployment, Service, HorizontalPodAutoscaler, PodDisruptionBudget, NetworkPolicy
# Image      : Docker Hub (docker.io/ckreddy3030), updated by the docker-catalog-api-ci.yml bot PR
# Secrets    : Kubernetes Secrets created with kubectl (never in Git): docs/docker-desktop-setup.md, A3
#
# Deployed by: Argo CD app "catalog-api" (k8s/docker-desktop/argocd/applications.yaml)
# By hand    : kubectl apply -f k8s/docker-desktop/apps/catalog-api.yaml
# -----------------------------------------------------------------------

# ServiceAccount: the identity of the pod. Istio uses it as the caller identity in AuthorizationPolicies
# (cluster.local/ns/default/sa/catalog-api), so the name must stay "catalog-api".
apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalog-api
  namespace: default
# No Kubernetes API token in the pod: the app never calls the Kubernetes API.
# (The Istio sidecar gets its own token through a separate volume, so mTLS still works.)
automountServiceAccountToken: false
---
# Deployment: runs and updates the pods.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  namespace: default
  labels:
    app.kubernetes.io/name: catalog-api
spec:
  replicas: 1                    # laptop: 1 pod per service saves memory; the HPA can add up to 3
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog-api   # which pods belong to this Deployment
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0           # never remove the old pod before the new one is ready (zero downtime)
      maxSurge: 1                 # start one extra pod at a time during an update
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-api       # used by the selector above, Service, PDB and NetworkPolicy
        app.kubernetes.io/instance: catalog-api   # the Istio AuthorizationPolicy for catalog-api selects this label
    spec:
      serviceAccountName: catalog-api
      automountServiceAccountToken: false
      securityContext:            # pod level: applies to every container
        runAsNonRoot: true        # Kubernetes refuses to start the pod if it would run as root (UID 0)
        runAsUser: 10001           # user created in the catalog-api Dockerfile
        seccompProfile:
          type: RuntimeDefault    # block risky Linux system calls (container runtime default list)
      containers:
        - name: catalog-api
          # CI replaces this whole line with <image>:<tag>@<digest> (docker-catalog-api-ci.yml bot PR). Do not edit it by hand.
          image: docker.io/ckreddy3030/catalog-api:9cc713b@sha256:6742c5ec44c8614ade926e2e4210bac41310ce4a5401b3add79bd216be5063f1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          securityContext:        # container level
            allowPrivilegeEscalation: false   # a process can never gain more privileges than it started with
            readOnlyRootFilesystem: true      # nobody can change files in the image; writable paths are volumes below
            capabilities:
              drop: ["ALL"]       # remove all extra Linux privileges
          env:
            # base URL of product images; the database stores only the path (products/<name>.webp).
            # "/images/" = same site as the shop: the Istio route sends /images/ to image-server (PVC).
            # (Azure Blob Storage was used before; moving images again only changes this value.)
            - name: IMAGES_BASE_URL
              value: "/images/"
            # key that CHECKS login tokens on /admin/** (same key auth-api signs with)
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: auth-api-secret       # created with kubectl create secret (not in Git)
                  key: Jwt__Key
          resources:
            requests:             # reserved for the pod: used for scheduling and as the 100% base for the HPA
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi      # Java needs more memory (heap + JVM); the pod is restarted (OOMKilled) above this; no CPU limit, so no throttling
          # Java starts slowly: liveness and readiness only begin after the startupProbe succeeded.
          # Up to 30 x 5s = 150 seconds to start before Kubernetes restarts the container.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:          # restart the container if this fails (process hung)
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:         # send traffic only while this succeeds (Spring Boot Actuator readiness group)
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            # Tomcat (embedded web server) needs /tmp: without it the app fails with "Unable to create tempDir"
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi     # empty folder per pod, deleted with the pod
---
# Service: one stable name and IP (catalog-api:8081) in front of the pods. nginx.conf and the other services use this name.
apiVersion: v1
kind: Service
metadata:
  name: catalog-api
  namespace: default
  labels:
    app.kubernetes.io/name: catalog-api
spec:
  type: ClusterIP                # internal only; users come in through the Istio ingress gateway
  selector:
    app.kubernetes.io/name: catalog-api   # send traffic to the pods with this label
  ports:
    - name: http                 # Istio uses the port name to detect the protocol
      port: 8081
      targetPort: 8081
---
# HorizontalPodAutoscaler: adds pods when CPU is busy, removes them when it is quiet.
# Needs metrics-server (not installed by default on Docker Desktop: docs/docker-desktop-setup.md, A8).
# Without it "kubectl get hpa" shows <unknown> and nothing scales (the Deployment still runs).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: catalog-api
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: catalog-api
  minReplicas: 1                 # same as the Deployment
  maxReplicas: 3                 # laptop limit
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70   # target: 70% of the CPU request (100m) on average
---
# PodDisruptionBudget: during voluntary disruptions (node drain) keep at least 1 pod running.
# With 1 replica this blocks "kubectl drain" until the HPA (or you) adds a second pod; set replicas: 2 to practise it.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: catalog-api
  namespace: default
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog-api
---
# NetworkPolicy: which pods may CONNECT to this service (ingress = incoming traffic).
# On Docker Desktop it is only enforced if the cluster's network plugin supports NetworkPolicy; the Istio
# AuthorizationPolicies (istio/common/authorization-policies/) are the rules that always apply here.
# Egress (outgoing) is not restricted.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: catalog-api
  namespace: default
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: catalog-api   # the pods this policy protects
  policyTypes:
    - Ingress
  ingress:
    # 1) The app port: only the allowed callers
    - from:
        # Only these services (pods in the same namespace with these labels)
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: customer-portal
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: admin-portal
      ports:
        - protocol: TCP
          port: 8081
    # 2) Istio sidecar ports, from anywhere: the kubelet's health probes (Istio rewrites them to 15020),
    #    the sidecar's own readiness (15021) and Prometheus scraping the merged metrics (15020).
    #    They expose only health and metrics, never the app.
    - ports:
        - protocol: TCP
          port: 15020
        - protocol: TCP
          port: 15021
