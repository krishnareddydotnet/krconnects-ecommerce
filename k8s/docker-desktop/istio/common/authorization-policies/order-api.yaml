# order-api: orders, called by both portals' nginx.
# ALLOW policy = only the callers listed below may call this service; everyone else is denied.
# Callers are identified by their service account (verified through mTLS).
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: order-api
  namespace: default
spec:
  action: ALLOW
  selector:
    matchLabels:
      app.kubernetes.io/instance: order-api
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/default/sa/customer-portal          # place order
              - cluster.local/ns/default/sa/admin-portal             # admin orders page
