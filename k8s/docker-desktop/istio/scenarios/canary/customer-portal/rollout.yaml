# Canary scenario for customer-portal: ServiceAccount, Rollout, stable Service, canary Service.
# Replaces the basic Deployment of customer-portal (remove the Argo CD app "customer-portal" first).
# Prerequisite: Argo Rollouts controller (docs/docker-desktop-setup.md, B7).

# ServiceAccount: same name as before, because auth-api, catalog-api and order-api
# only accept calls from cluster.local/ns/default/sa/customer-portal
apiVersion: v1
kind: ServiceAccount
metadata:
  name: customer-portal
  namespace: default
automountServiceAccountToken: false     # the app never calls the Kubernetes API
---
# Rollout: a Deployment with canary steps. Changing the image starts a canary.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: customer-portal
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/instance: customer-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: customer-portal
        app.kubernetes.io/instance: customer-portal   # customer-portal AuthorizationPolicy selects this label
    spec:
      serviceAccountName: customer-portal
      containers:
        - name: customer-portal
          image: docker.io/ckreddy3030/customer-portal:2bcfe92@sha256:29dd18a93d140b2851cb97c47b1f55dfcbb401d66c90eb31d9200993e1be9427   # set by customer-portal ci
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080       # nginx-unprivileged listens on 8080
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
  strategy:
    canary:
      stableService: customer-portal-stable     # Rollouts points this at the CURRENT version's pods
      canaryService: customer-portal-canary     # Rollouts points this at the NEW version's pods
      trafficRouting:
        istio:
          virtualService:
            name: krconnects-virtualservice     # Rollouts changes the weights in this VirtualService
            routes:
              - primary                         # route name inside that VirtualService
      steps:
        - setWeight: 10                         # 10% of requests to the new version
        - pause: {}                             # wait for manual promote
        - setWeight: 25
        - pause: {}
        - setWeight: 50
        - pause: {}
        - setWeight: 75
        - pause: {}
        # after the last promote: 100% new version, it becomes stable, old pods removed
---
# Stable Service: the current version
apiVersion: v1
kind: Service
metadata:
  name: customer-portal-stable
  namespace: default
spec:
  selector:
    app.kubernetes.io/instance: customer-portal   # Rollouts adds a hidden hash label: only stable pods
  ports:
    - name: http                # Istio detects HTTP from the port name
      port: 8080
      targetPort: 8080
---
# Canary Service: the new version
apiVersion: v1
kind: Service
metadata:
  name: customer-portal-canary
  namespace: default
spec:
  selector:
    app.kubernetes.io/instance: customer-portal   # Rollouts adds a hidden hash label: only canary pods
  ports:
    - name: http
      port: 8080
      targetPort: 8080