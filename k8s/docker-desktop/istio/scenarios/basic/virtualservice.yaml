# Routing: everything that arrives at the gateway goes to customer-portal.
# customer-portal's nginx then forwards /api/, /catalog-api/ and /order-api/ to the backends.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: krconnects-virtualservice
  namespace: default
spec:
  hosts:
    - "*"
  gateways:
    - krconnects-gateway
  http:
    - route:
        - destination:
            host: customer-portal     # Kubernetes Service name
            port:
              number: 8080
