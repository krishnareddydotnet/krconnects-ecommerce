# VirtualService: http://grafana.localhost -> Grafana UI (monitoring namespace)
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: grafana
  namespace: monitoring
spec:
  hosts:
    - grafana.localhost              # only requests with Host: grafana.localhost
  gateways:
    - default/krconnects-gateway         # <namespace>/<name>: the Gateway is in "default"
  http:
    - route:
        - destination:
            host: kube-prometheus-stack-grafana.monitoring.svc.cluster.local
            port:
              number: 80                 # Service port (Grafana itself listens on 3000 inside the pod)
