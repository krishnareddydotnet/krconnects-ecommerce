# Canary traffic split for customer-portal.
# Same name as k8s/docker-desktop/istio/virtualservice.yaml, so applying this file REPLACES the normal
# route with a weighted one. Change the two weights (they must add up to 100) to move traffic:
#   90/10 -> 50/50 -> 0/100 (promote)  or  100/0 (roll back)
# Istio splits per REQUEST, so 10% works even with one pod per version.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: krconnects-virtualservice
  namespace: default
spec:
  hosts:
    - "*"
  gateways:
    - krconnects-gateway
  http:
    - route:
        - destination:
            host: customer-portal          # v1 (Argo CD)
            port:
              number: 8080
          weight: 90
        - destination:
            host: customer-portal-v2       # v2 (canary, Helm release customer-portal-v2)
            port:
              number: 8080
          weight: 10
