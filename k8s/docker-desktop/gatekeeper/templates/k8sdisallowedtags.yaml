# Policy 6: no ":latest" (or missing) image tag (simplified from the library template "k8sdisallowedtags").
# Problem: a moving tag means you cannot tell which version runs, and a rollback may pull a different image.
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sdisallowedtags
spec:
  crd:
    spec:
      names:
        kind: K8sDisallowedTags
      validation:
        openAPIV3Schema:
          type: object
          properties:
            tags:
              type: array
              items:
                type: string              # forbidden tags, e.g. ["latest"]
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sdisallowedtags

        # Image ends with a forbidden tag, e.g. "busybox:latest"
        violation[{"msg": msg}] {
          container := input_containers[_]
          tag := input.parameters.tags[_]
          endswith(container.image, concat("", [":", tag]))
          msg := sprintf("container <%v> uses the disallowed tag <%v> (image %v)", [container.name, tag, container.image])
        }

        # Image has no tag and no digest at all, e.g. "busybox" (Kubernetes then pulls :latest)
        violation[{"msg": msg}] {
          container := input_containers[_]
          parts := split(container.image, "/")
          name := parts[count(parts) - 1]                   # last part, e.g. "busybox" or "order-api:9cc713b"
          not contains(name, ":")
          not contains(name, "@")
          msg := sprintf("container <%v> has no image tag (image %v); pin a version tag or digest", [container.name, container.image])
        }

        input_containers[c] {
          c := input.review.object.spec.containers[_]
        }
        input_containers[c] {
          c := input.review.object.spec.initContainers[_]
        }
