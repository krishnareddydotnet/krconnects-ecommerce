# -----------------------------------------------------------------------
# auth-api on AKS: signup/login, issues JWT tokens
#
# Tech stack : .NET 10, ASP.NET Core Web API, JWT
# Port       : 8080
# Runs as    : UID 1654 (app user of the .NET image ($APP_UID))
# Objects    : ServiceAccount, Deployment, Service, HorizontalPodAutoscaler, PodDisruptionBudget, NetworkPolicy
# Secrets    : from Azure Key Vault via SecretProviderClass "jwt-key-kv" (k8s/aks/key-vault/jwt-key-kv.yaml)
#
# Apply      : kubectl apply -f k8s/aks/apps/auth-api.yaml
# -----------------------------------------------------------------------

# ServiceAccount: the identity of the pod inside Kubernetes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-api
  namespace: default
  annotations:
    # Workload Identity: this ServiceAccount may log in to Azure as this managed identity (client ID, not a secret).
    # The identity has a federated credential for "system:serviceaccount:default:auth-api" and can read Key Vault secrets.
    azure.workload.identity/client-id: "b49007d2-b04a-453e-938a-4980fc2e66c4"
# No Kubernetes API token in the pod: the app never calls the Kubernetes API.
automountServiceAccountToken: false
---
# Deployment: runs and updates the pods.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-api
  namespace: default
  labels:
    app.kubernetes.io/name: auth-api
spec:
  replicas: 2                    # 2 pods, so one can be down (update, node drain) without an outage; the HPA adds more
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-api   # which pods belong to this Deployment
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0           # never remove an old pod before a new one is ready (zero downtime)
      maxSurge: 1                 # start one extra pod at a time during an update
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-api   # must match the selector above (also used by Service, PDB, NetworkPolicy)
        azure.workload.identity/use: "true"   # Workload Identity webhook injects the Azure token into this pod
    spec:
      serviceAccountName: auth-api
      automountServiceAccountToken: false
      securityContext:            # pod level: applies to every container
        runAsNonRoot: true        # Kubernetes refuses to start the pod if it would run as root (UID 0)
        runAsUser: 1654           # app user of the .NET image ($APP_UID)
        seccompProfile:
          type: RuntimeDefault    # block risky Linux system calls (container runtime default list)
      containers:
        - name: auth-api
          # CI replaces this whole line with <image>:<tag>@<digest> (bot PR). Do not edit it by hand.
          image: krconnectspractice.azurecr.io/auth-api:48b03e9@sha256:9e747e4e164f076968bf9c0a7bddee87aa865871ba77496907af67d11b24a397
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:        # container level
            allowPrivilegeEscalation: false   # a process can never gain more privileges than it started with
            readOnlyRootFilesystem: true      # nobody can change files in the image; writable paths are volumes below
            capabilities:
              drop: ["ALL"]       # remove all extra Linux privileges
          env:
            # key that SIGNS login tokens (Key Vault secret jwt-key)
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: auth-api-secret       # Kubernetes Secret created by the Key Vault CSI driver (secretObjects)
                  key: Jwt__Key
            # where auth-api finds the Data API (Service name)
            - name: DataApi__Url
              value: "http://data-api:8080"
            # usernames (comma-separated) that get role "admin"; placeholder, not a secret
            - name: Admin__Usernames
              value: "admin"
          resources:
            requests:             # reserved for the pod: used for scheduling and as the 100% base for the HPA
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi      # the pod is restarted (OOMKilled) above this; no CPU limit, so no throttling
          livenessProbe:          # restart the container if this fails (process hung)
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:         # send traffic only while this succeeds (app is ready to take requests)
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            # .NET runtime temp files (the app starts without it, but .NET expects a writable /tmp)
            - name: tmp
              mountPath: /tmp
            # Key Vault secrets as files (read-only). Mounting this volume is ALSO what makes the CSI driver
            # create/refresh the Kubernetes Secret used in env above: no mount = no synced Secret.
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi     # empty folder per pod, deleted with the pod
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io   # Azure Key Vault provider for the Secrets Store CSI driver (AKS add-on)
            readOnly: true
            volumeAttributes:
              secretProviderClass: jwt-key-kv   # which Key Vault secrets to fetch (k8s/aks/key-vault/jwt-key-kv.yaml)
---
# Service: one stable name and IP (auth-api:8080) in front of the pods.
apiVersion: v1
kind: Service
metadata:
  name: auth-api
  namespace: default
  labels:
    app.kubernetes.io/name: auth-api
spec:
  type: ClusterIP                # internal only; users come in through the Istio ingress gateway
  selector:
    app.kubernetes.io/name: auth-api   # send traffic to the pods with this label
  ports:
    - name: http                 # Istio uses the port name to detect the protocol
      port: 8080
      targetPort: 8080
---
# HorizontalPodAutoscaler: adds pods when CPU is busy, removes them when it is quiet.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auth-api
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: auth-api
  minReplicas: 2                 # same as the Deployment, so there are always 2 pods
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70   # target: 70% of the CPU request (100m) on average
---
# PodDisruptionBudget: during voluntary disruptions (node upgrade, drain) keep at least 1 pod running.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: auth-api
  namespace: default
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-api
---
# NetworkPolicy: which pods may CONNECT to this service (ingress = incoming traffic).
# Everything not listed below is blocked on the way in.
# Egress (outgoing) is not restricted yet: that is a later step (it must allow DNS, Azure SQL on 1433, istiod).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-api
  namespace: default
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: auth-api   # the pods this policy protects
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Only these services (pods in the same namespace with these labels)
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: customer-portal
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: admin-portal
      ports:
        - protocol: TCP
          port: 8080               # only the app port
