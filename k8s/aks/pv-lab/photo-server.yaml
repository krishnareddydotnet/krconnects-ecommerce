# A small nginx web server that shows the files stored on the PVC.
# You copy a photo into the volume (kubectl cp) and open it in the browser.
#
# Objects in this file: ConfigMap (nginx config), Deployment (the pod), Service (stable address).
# Runs in namespace "pv-lab": no Istio sidecar and no Kyverno image policy (those apply to "default").
---
# nginx config: serve /photos/ from the volume and list the files in the browser
apiVersion: v1
kind: ConfigMap
metadata:
  name: photo-server-nginx
  namespace: pv-lab
data:
  default.conf: |
    server {
        listen 8080;

        # http://localhost:8080/photos/ -> list of files on the PVC
        location /photos/ {
            root /usr/share/nginx/html;   # /photos/x.png -> /usr/share/nginx/html/photos/x.png
            autoindex on;                 # show a simple file list
        }

        location / {
            return 200 "photo-server is running. Open /photos/\n";
            add_header Content-Type text/plain;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: photo-server
  namespace: pv-lab
  labels:
    app.kubernetes.io/name: photo-server
spec:
  replicas: 1                        # step 5 scales this to 2 (on different nodes) for the RWX demo
  selector:
    matchLabels:
      app.kubernetes.io/name: photo-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: photo-server
    spec:
      automountServiceAccountToken: false   # this pod never calls the Kubernetes API
      securityContext:
        runAsNonRoot: true
        runAsUser: 101                # nginx-unprivileged user; matches uid=101 in the StorageClass mountOptions
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:              # prefer a different node for each replica (shows RWX across nodes)
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: photo-server
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:alpine   # same base image as the portals; alpine includes tar (needed by kubectl cp)
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true   # only the volumes below are writable
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          volumeMounts:
            - name: photos                 # THE PVC: survives pod restarts, shared by all replicas
              mountPath: /usr/share/nginx/html/photos
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: tmp                    # nginx writes its pid and cache files to /tmp
              mountPath: /tmp
      volumes:
        - name: photos
          persistentVolumeClaim:
            claimName: photos-pvc          # connects the pod to the PVC from pvc.yaml
        - name: nginx-config
          configMap:
            name: photo-server-nginx
        - name: tmp
          emptyDir: {}                     # temporary: deleted with the pod (compare with the PVC!)
---
apiVersion: v1
kind: Service
metadata:
  name: photo-server
  namespace: pv-lab
spec:
  selector:
    app.kubernetes.io/name: photo-server
  ports:
    - port: 8080
      targetPort: 8080
