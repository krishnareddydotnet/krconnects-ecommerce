# data-api: .NET Web API (internal only, port 8080)

fullnameOverride: data-api   # must match nginx.conf: http://data-api:8080

image:
  repository: krconnectspractice.azurecr.io/data-api
  tag: "0c3cd44"
  digest: "sha256:15a413b10654ffd84aa42a6b5170940a60115534b3b7619835325aa4036289ef"
  pullPolicy: IfNotPresent

env:
  - name: ConnectionStrings__DataDb
    valueFrom:
      secretKeyRef:
        name: data-api-secret
        key: ConnectionStrings__DataDb

service:
  type: ClusterIP      # internal only
  port: 8080

livenessProbe:
  httpGet:
    path: /health/live
    port: http

readinessProbe:
  httpGet:
    path: /health/ready
    port: http