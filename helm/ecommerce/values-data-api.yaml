# data-api: .NET Web API (internal only, port 8080)

fullnameOverride: data-api   # must match nginx.conf: http://data-api:8080

image:
  repository: ckreddy3030/data-api
  # tag    = human-readable: which commit/version (set by CI)
  # digest = sha256 of the image content, set by CI; this is what Kubernetes actually pulls
  tag: "c3700ee"
  digest: "sha256:e52538c0798585e17620ae3d4388214f1edb61f9735a04c9d4933d66d926a6de"
  pullPolicy: IfNotPresent

env:
  - name: ConnectionStrings__DataDb
    valueFrom:
      secretKeyRef:
        name: data-api-secret
        key: ConnectionStrings__DataDb

service:
  type: ClusterIP      # internal only
  port: 8080

livenessProbe:
  httpGet:
    path: /health/live
    port: http

readinessProbe:
  httpGet:
    path: /health/ready
    port: http