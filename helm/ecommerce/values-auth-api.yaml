# auth-api: .NET Web API (internal only, port 8080)

fullnameOverride: auth-api   # must match nginx.conf: http://auth-api:8080

image:
  repository: krconnectspractice.azurecr.io/auth-api
  tag: "0c3cd44"
  digest: "sha256:67a83a994c19a485f512623b137a05393c86629b6ba14cbd91e92b990641327e"
  pullPolicy: IfNotPresent

env:
  # Secret used to sign login tokens (JWT). Created with kubectl, never stored in Git.
  - name: Jwt__Key
    valueFrom:
      secretKeyRef:
        name: auth-api-secret
        key: Jwt__Key
  # Where auth-api finds the Data API (Kubernetes Service name)
  - name: DataApi__Url
    value: "http://data-api:8080"
  # Usernames (comma-separated) that get role "admin" in their login token.
  # Placeholder: replace with the username(s) you signed up as admin. Not a secret.
  - name: Admin__Usernames
    value: "admin"

service:
  type: ClusterIP      # internal only
  port: 8080

livenessProbe:
  httpGet:
    path: /health/live
    port: http

readinessProbe:
  httpGet:
    path: /health/ready
    port: http