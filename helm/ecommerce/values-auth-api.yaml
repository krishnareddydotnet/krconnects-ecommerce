# auth-api: .NET Web API (internal only, port 8080)

fullnameOverride: auth-api   # must match nginx.conf: http://auth-api:8080

image:
  # Registry the CI pushed the current image to (CI updates this line, like tag and digest).
  # Override it with an extra -f registries/<name>.yaml (the last -f wins).
  registry: "docker.io/ckreddy3030"
  # image NAME only (no registry part)
  repository: auth-api
  tag: "9467c61"
  digest: "sha256:0b11d1fe3e611630da99162387d89f9c18ee68872a348d0710ac7d111e657fe2"
  pullPolicy: IfNotPresent

env:
  # Secret used to sign login tokens (JWT). Created with kubectl, never stored in Git.
  - name: Jwt__Key
    valueFrom:
      secretKeyRef:
        name: auth-api-secret
        key: Jwt__Key
  # Where auth-api finds the Data API (Kubernetes Service name)
  - name: DataApi__Url
    value: "http://data-api:8080"
  # Usernames (comma-separated) that get role "admin" in their login token.
  # Placeholder: replace with the username(s) you signed up as admin. Not a secret.
  - name: Admin__Usernames
    value: "admin"

service:
  type: ClusterIP      # internal only
  port: 8080

livenessProbe:
  httpGet:
    path: /health/live
    port: http

readinessProbe:
  httpGet:
    path: /health/ready
    port: http