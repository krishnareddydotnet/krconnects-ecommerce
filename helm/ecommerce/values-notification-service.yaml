# notification-service: Node.js background worker (internal only, port 8083 = health probes only)
# Reads OrderPlaced messages from Azure Service Bus and sends order confirmations.

fullnameOverride: notification-service   # also the Deployment name KEDA scales (deploy/keda-scaledobject.yaml)

image:
  repository: krconnectspractice.azurecr.io/notification-service
  # tag    = human-readable: which commit/version (set by CI)
  # digest = sha256 of the image content, set by CI; this is what Kubernetes actually pulls
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

env:
  # Azure Service Bus (not secrets: login uses Workload Identity, no connection string).
  # Replace <your-namespace> with your Service Bus namespace.
  - name: SERVICEBUS_NAMESPACE
    value: "<your-namespace>.servicebus.windows.net"
  - name: SERVICEBUS_TOPIC
    value: "orders"
  - name: SERVICEBUS_SUBSCRIPTION
    value: "notification-service"

# Workload Identity: the pod logs in to Azure as a managed identity (no keys).
# The Kubernetes ServiceAccount is named "notification-service" (from fullnameOverride);
# the managed identity has a federated credential for that ServiceAccount.
serviceAccount:
  annotations:
    # Client ID of the notification-service managed identity (see docs/service-bus-setup.md).
    # Not a secret, but specific to your Azure subscription, so it is left empty here.
    azure.workload.identity/client-id: ""

podLabels:
  # Tells the AKS Workload Identity webhook to inject the Azure token into this pod
  azure.workload.identity/use: "true"

service:
  type: ClusterIP      # internal only (nothing calls it except the health probes)
  port: 8083

livenessProbe:
  httpGet:
    path: /health/live
    port: http

readinessProbe:
  httpGet:
    path: /health/ready
    port: http
