# customer-portal: React UI served by nginx (non-root, port 8080)

# Fixed name, so the Deployment and Service are called "customer-portal"
fullnameOverride: customer-portal

image:
  # Registry the CI pushed the current image to (CI updates this line, like tag and digest).
  # Override it with an extra -f registries/<name>.yaml (the last -f wins).
  registry: "docker.io/ckreddy3030"
  # image NAME only (no registry part)
  repository: customer-portal
  tag: "a54eef4"
  digest: "sha256:636593b864deeb64df8ae3ad41e2b97c5aff69907a3dba615d3a51414d74ef46"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP   # internal only; users reach it through the Istio ingress gateway
  port: 8080           # also used as the containerPort by the chart

livenessProbe:
  httpGet:
    path: /health/live
    port: http

readinessProbe:
  httpGet:
    path: /health/ready
    port: http